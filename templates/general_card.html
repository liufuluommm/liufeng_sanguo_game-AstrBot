<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 420px; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #0d0d12;
    color: #f0e6d2;
  }
  .card {
    width: 420px; padding: 20px;
    background:
      radial-gradient(circle at top, rgba(212,175,55,.18), transparent 60%),
      linear-gradient(160deg, #1a1a24 0%, #0d0d12 100%);
    border: 2px solid #d4af37;
    border-radius: 16px;
  }
  .head { display: flex; align-items: center; gap: 14px; }
  .portrait {
    width: 84px; height: 84px; border-radius: 12px;
    border: 2px solid #d4af37;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 700;
    background: linear-gradient(160deg, #3a2a12, #1a1208);
    color: #f5d76e;
  }
  .title { flex: 1; }
  .name { font-size: 30px; font-weight: 800; color: #f5d76e; letter-spacing: 2px; }
  .sub { font-size: 14px; color: #b8a888; margin-top: 6px; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 10px;
    font-size: 13px; font-weight: 700; margin-right: 6px;
  }
  .ssr { background: linear-gradient(90deg,#ff9d00,#ff5e00); color:#fff; }
  .sr  { background: linear-gradient(90deg,#a06bff,#6a3bff); color:#fff; }
  .r   { background: linear-gradient(90deg,#3aa0ff,#1f6fff); color:#fff; }
  .n   { background: linear-gradient(90deg,#8a8a8a,#5a5a5a); color:#fff; }
  .custom { background: linear-gradient(90deg,#00c896,#009e75); color:#fff; }
  .stats { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .stat { background: rgba(255,255,255,.04); border-radius: 10px; padding: 12px 6px; text-align: center; }
  .stat .k { font-size: 12px; color: #b8a888; }
  .stat .v { font-size: 24px; font-weight: 800; color: #f5d76e; margin-top: 4px; }
  .power {
    margin-top: 16px; text-align: center; font-size: 20px; font-weight: 800;
    color: #ffce54; border-top: 1px dashed #55492a; padding-top: 14px;
  }
  .skill { margin-top: 14px; font-size: 14px; color: #cbbf9c; line-height: 1.7; }
  .desc { margin-top: 10px; font-size: 13px; color: #8f8672; line-height: 1.6; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="portrait">{{ glyph }}</div>
      <div class="title">
        <div class="name">{{ name }}</div>
        <div class="sub">
          <span class="badge {{ rarity_class }}">{{ rarity_label }}</span>
          <span>{{ faction_label }} · {{ troop_label }}</span>
        </div>
        <div class="sub">Lv.{{ level }} ★{{ star }}{% if title %} · {{ title }}{% endif %}</div>
      </div>
    </div>
    <div class="stats">
      {% for a in attrs %}
      <div class="stat"><div class="k">{{ a.label }}</div><div class="v">{{ a.value }}</div></div>
      {% endfor %}
    </div>
    <div class="power">战力 {{ power }}</div>
    <div class="skill">技能：{{ skill }}</div>
    <div class="desc">{{ desc }}</div>
  </div>
</body>
</html>
